name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract project
      run: |
        unzip -q Dafter_iOS_Project_FIXED.zip -d extracted_project

    - name: Show Xcode information
      run: |
        xcodebuild -version

    - name: Build iOS app
      run: |
        # البحث عن مجلد المشروع المستهدف تلقائياً
        PROJ_PATH=$(find extracted_project -name "*.xcodeproj" -maxdepth 3 | head -n 1)
        if [ -z "$PROJ_PATH" ]; then
          echo "Error: No .xcodeproj file found!"
          exit 1
        fi
        
        PROJ_DIR=$(dirname "$PROJ_PATH")
        cd "$PROJ_DIR"
        echo "Building project at: $(pwd)"
        
        # تنفيذ عملية البناء
        xcodebuild -project *.xcodeproj \
                   -scheme Dafter \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   clean build

    - name: Create Payload and IPA
      run: |
        # البحث عن ملف App المبني وتحويله إلى IPA
        APP_PATH=$(find extracted_project -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: .app file not found after build!"
          exit 1
        fi
        
        WORKDIR=$(dirname "$APP_PATH")
        cd "$WORKDIR"
        mkdir -p Payload
        cp -r "$(basename "$APP_PATH")" Payload/
        zip -r Dafter.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dafter-iOS-IPA
        path: "**/Dafter.ipa"
