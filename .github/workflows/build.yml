name: Build Dafter iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Dafter_iOS_Project.zip -d extracted

      - name: Show Xcode information
        run: |
          xcodebuild -version
          xcodebuild \
            -project extracted/Dafter_iOS/Dafter/Dafter.xcodeproj \
            -list

      - name: Build iOS app
        run: |
          xcodebuild \
            -project extracted/Dafter_iOS/Dafter/Dafter.xcodeproj \
            -target Dafter \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Find app
        run: |
          find build -name "Dafter.app" -print

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Dafter.app Payload/
          zip -r Dafter.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dafter-iOS
          path: Dafter.ipa
