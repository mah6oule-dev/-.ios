name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract project
      run: |
        unzip -q Dafter_iOS_Project_FIXED.zip -d extracted_project

    - name: Show Xcode information
      run: |
        xcodebuild -version

    - name: Build iOS app
      run: |
        PROJ_PATH=$(find extracted_project -name "*.xcodeproj" -maxdepth 3 | head -n 1)
        if [ -z "$PROJ_PATH" ]; then
          echo "Error: No .xcodeproj file found!"
          exit 1
        fi
        
        PROJ_DIR=$(dirname "$PROJ_PATH")
        cd "$PROJ_DIR"
        echo "Building project at: $(pwd)"
        
        # التجاوز الكامل لإعدادات التوقيع والـ Provisioning Profile
        xcodebuild clean build \
                   -project *.xcodeproj \
                   -scheme Dafter \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGN_ENTITLEMENTS="" \
                   CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
                   PROVISIONING_PROFILE_SPECIFIER=""

    - name: Create Payload and IPA
      run: |
        APP_PATH=$(find extracted_project -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: .app file not found after build!"
          exit 1
        fi
        
        WORKDIR=$(dirname "$APP_PATH")
        cd "$WORKDIR"
        mkdir -p Payload
        cp -r "$(basename "$APP_PATH")" Payload/
        zip -r Dafter.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dafter-iOS-IPA
        path: "**/Dafter.ipa"
